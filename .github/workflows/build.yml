name: Build Go Project

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [windows, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build
        run: |
          if [ "${{ matrix.os }}" == "windows" ]; then
            GOOS=windows GOARCH=amd64 go build -o anto.exe ./cmd/...
          else
            GOOS=linux GOARCH=amd64 go build -o anto ./cmd/...
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: myapp-${{ matrix.os }}
          path: |
            myapp*
            *.exe
